name: Package
on:
  pull_request:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do node --check "$file" || exit 1; done
      - name: Validate and package runtime resources
        run: |
          python3 scripts/package.py --output private/dist/FreshestView.zip
          python3 scripts/package.py --check --firefox-id "freshestview@makr91.github.io"
      - uses: actions/upload-artifact@v7
        with:
          name: FreshestView
          path: private/dist/FreshestView.zip
          archive: false
          if-no-files-found: error
